<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pastrimi Operations Console</title>
<style>
:root {
  --gray:        #c0c0c0;
  --gray-light:  #ffffff;
  --gray-mid:    #808080;
  --gray-dark:   #000000;
  --gray-fill:   #dfdfdf;
  --teal-bg:     #008080;
  --titlebar-1:  #000080;
  --titlebar-2:  #1084d0;
  --titlebar-3:  #7f7f7f;
  --titlebar-4:  #b5b5b5;
  --highlight:   #000080;
  --highlight-text: #ffffff;
  --field-bg:    #ffffff;
  --positive:    #008000;
  --negative:    #aa0000;
  --warn:        #806000;
  --met:         #008000;
  --breach:      #aa0000;
  --edge:        #806000;
  --font-sys:    "MS Sans Serif","Microsoft Sans Serif","Pixelated MS Sans Serif",Tahoma,Verdana,sans-serif;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
  height: 100vh;
  overflow: hidden;
  background: var(--teal-bg);
  color: var(--gray-dark);
  font-family: var(--font-sys);
  font-size: 14px;
  -webkit-font-smoothing: none;
  -moz-osx-font-smoothing: grayscale;
  cursor: default;
  user-select: none;
}

body { display: flex; padding: 0; }

/* ===== WINDOW ===== */
.window {
  background: var(--gray);
  border-top: 2px solid var(--gray-light);
  border-left: 2px solid var(--gray-light);
  border-right: 2px solid var(--gray-mid);
  border-bottom: 2px solid var(--gray-mid);
  box-shadow: 1px 1px 0 0 var(--gray-dark), inset -1px -1px 0 0 var(--gray-mid);
  display: flex;
  flex-direction: column;
  flex: 1;
  margin: 8px;
  min-height: 0;
}

.title-bar {
  background: linear-gradient(90deg, var(--titlebar-1) 0%, var(--titlebar-2) 100%);
  color: white;
  padding: 4px 6px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-weight: bold;
  font-size: 13px;
  height: 26px;
  flex-shrink: 0;
}
.title-bar .title-text {
  display: flex;
  align-items: center;
  gap: 5px;
  padding-left: 2px;
}
.title-bar .title-icon {
  width: 18px;
  height: 18px;
  background: #c0c0c0;
  border: 1px solid #000;
  display: inline-block;
  position: relative;
}
.title-bar .title-icon::before {
  content: '';
  position: absolute;
  inset: 2px;
  background: linear-gradient(135deg, #ff8 0%, #aa6 50%, #884 100%);
}
.title-bar .controls { display: flex; gap: 2px; }
.title-bar .ctrl {
  width: 20px;
  height: 18px;
  background: var(--gray);
  border-top: 1px solid var(--gray-light);
  border-left: 1px solid var(--gray-light);
  border-right: 1px solid var(--gray-mid);
  border-bottom: 1px solid var(--gray-mid);
  font-size: 11px;
  font-weight: bold;
  color: var(--gray-dark);
  text-align: center;
  line-height: 16px;
}

.menu-bar {
  background: var(--gray);
  padding: 3px 4px;
  display: flex;
  font-size: 13px;
  flex-shrink: 0;
}
.menu-bar .menu { padding: 3px 10px; }
.menu-bar .menu:hover { background: var(--highlight); color: var(--highlight-text); }
.menu-bar .menu .underline { text-decoration: underline; }

.content {
  flex: 1;
  padding: 8px;
  display: grid;
  grid-template-rows: auto auto 1fr auto;
  gap: 8px;
  min-height: 0;
  overflow: hidden;
}

.group {
  background: var(--gray);
  border-top: 1px solid var(--gray-mid);
  border-left: 1px solid var(--gray-mid);
  border-right: 1px solid var(--gray-light);
  border-bottom: 1px solid var(--gray-light);
  position: relative;
  padding: 12px 8px 8px;
  min-height: 0;
}
.group .group-label {
  position: absolute;
  top: -8px;
  left: 10px;
  background: var(--gray);
  padding: 0 6px;
  font-size: 13px;
}

/* ===== TOP STATUS STRIP ===== */
.status-strip {
  display: grid;
  grid-template-columns: repeat(6, 1fr);
  gap: 6px;
  font-size: 13px;
}
.status-cell {
  background: var(--field-bg);
  border-top: 1px solid var(--gray-mid);
  border-left: 1px solid var(--gray-mid);
  border-right: 1px solid var(--gray-light);
  border-bottom: 1px solid var(--gray-light);
  padding: 6px 8px;
  display: flex;
  flex-direction: column;
  gap: 2px;
}
.status-cell .label {
  font-size: 11px;
  color: var(--gray-mid);
  text-transform: uppercase;
}
.status-cell .value {
  font-weight: bold;
  font-size: 17px;
  font-family: "Courier New","Courier",monospace;
}
.status-cell .value.positive { color: var(--positive); }
.status-cell .value.negative { color: var(--negative); }
.status-cell .value.warn { color: var(--warn); }

/* ===== MANDATES ===== */
.mandates-grid {
  display: grid;
  grid-template-columns: repeat(6, 1fr);
  gap: 6px;
  height: 100%;
}
.mandate-card {
  background: var(--field-bg);
  border-top: 1px solid var(--gray-mid);
  border-left: 1px solid var(--gray-mid);
  border-right: 1px solid var(--gray-light);
  border-bottom: 1px solid var(--gray-light);
  padding: 6px 8px;
  display: flex;
  flex-direction: column;
  gap: 3px;
  font-size: 12px;
  position: relative;
}
.mandate-card .holder {
  font-weight: bold;
  font-size: 13px;
}
.mandate-card .text {
  color: var(--gray-mid);
  line-height: 1.3;
  flex: 1;
  font-size: 12px;
}
.mandate-card .status-bar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 6px;
  font-family: "Courier New",monospace;
  font-size: 12px;
  font-weight: bold;
  margin-top: 3px;
}
.mandate-card .status {
  text-transform: uppercase;
  letter-spacing: 0.04em;
}
.mandate-card .status.met    { color: var(--met); }
.mandate-card .status.edge   { color: var(--edge); }
.mandate-card .status.breach { color: var(--breach); }
.mandate-card .meter {
  flex: 1;
  height: 9px;
  background: #fff;
  border-top: 1px solid var(--gray-mid);
  border-left: 1px solid var(--gray-mid);
  border-right: 1px solid var(--gray-light);
  border-bottom: 1px solid var(--gray-light);
  padding: 1px;
}
.mandate-card .meter .fill {
  height: 100%;
  transition: width 0.4s ease, background 0.3s ease;
}
.mandate-card .meter .fill.met    { background: var(--met); }
.mandate-card .meter .fill.edge   { background: var(--edge); }
.mandate-card .meter .fill.breach { background: var(--breach); }

/* ===== MAIN: INBOX + EMAIL DETAIL ===== */
.main-grid {
  display: grid;
  grid-template-columns: 380px 1fr;
  gap: 8px;
  min-height: 0;
  overflow: hidden;
}

.inbox-frame, .detail-frame {
  background: var(--field-bg);
  border-top: 1px solid var(--gray-mid);
  border-left: 1px solid var(--gray-mid);
  border-right: 1px solid var(--gray-light);
  border-bottom: 1px solid var(--gray-light);
  overflow: auto;
  padding: 0;
}

.inbox-list {
  display: flex;
  flex-direction: column;
}
.email-item {
  padding: 7px 10px;
  border-bottom: 1px solid #ddd;
  display: grid;
  grid-template-columns: 18px 1fr;
  gap: 8px;
  align-items: start;
  font-size: 13px;
  cursor: default;
  line-height: 1.3;
}
.email-item:hover { background: #d4d0c8; }
.email-item.selected { background: var(--highlight); color: var(--highlight-text); }
.email-item.selected .sender, .email-item.selected .subject { color: var(--highlight-text); }
.email-item .icon {
  font-family: "Courier New",monospace;
  font-weight: bold;
  font-size: 14px;
  margin-top: 1px;
}
.email-item .sender { font-weight: bold; font-size: 13px; }
.email-item .subject { color: var(--gray-mid); font-size: 12px; line-height: 1.25; margin-top: 2px; }
.email-item.resolved .sender, .email-item.resolved .subject { text-decoration: line-through; color: #888; }
.email-item.resolved.selected .sender, .email-item.resolved.selected .subject { color: #ddd; }

.detail-frame .empty {
  color: var(--gray-mid);
  font-style: italic;
  text-align: center;
  padding: 40px 20px;
}
.detail-content {
  padding: 14px 16px;
  display: flex;
  flex-direction: column;
  gap: 12px;
  font-size: 13px;
  height: 100%;
}
.detail-content .header-row {
  display: grid;
  grid-template-columns: 70px 1fr;
  gap: 6px 14px;
  border-bottom: 1px solid #ccc;
  padding-bottom: 8px;
  font-size: 13px;
}
.detail-content .header-row .field-label {
  color: var(--gray-mid);
  text-transform: uppercase;
  font-size: 11px;
  font-weight: bold;
}
.detail-content .header-row .field-val { font-weight: bold; font-size: 13px; }
.detail-content .body-text {
  white-space: pre-wrap;
  line-height: 1.55;
  flex: 1;
  overflow: auto;
  font-family: "Courier New","Courier",monospace;
  font-size: 13px;
  background: #fafafa;
  padding: 10px 12px;
  border-top: 1px solid #ccc;
  border-left: 1px solid #ccc;
  border-right: 1px solid #fff;
  border-bottom: 1px solid #fff;
}
.detail-content .options-row {
  display: flex;
  flex-direction: column;
  gap: 5px;
}
.detail-content .options-label {
  font-size: 11px;
  color: var(--gray-mid);
  text-transform: uppercase;
  font-weight: bold;
  letter-spacing: 0.06em;
}
.detail-content .resolved-banner {
  background: #d4d0c8;
  border: 1px dotted var(--gray-mid);
  padding: 7px 12px;
  font-size: 12px;
  color: var(--gray-mid);
  font-style: italic;
}

/* ===== Win95 BUTTONS ===== */
.btn {
  background: var(--gray);
  border-top: 1px solid var(--gray-light);
  border-left: 1px solid var(--gray-light);
  border-right: 1px solid var(--gray-mid);
  border-bottom: 1px solid var(--gray-mid);
  box-shadow: inset -1px -1px 0 0 var(--gray-dark);
  padding: 7px 14px;
  font-family: var(--font-sys);
  font-size: 13px;
  color: var(--gray-dark);
  cursor: default;
  text-align: left;
  position: relative;
}
.btn:active:not(:disabled) {
  border-top: 1px solid var(--gray-mid);
  border-left: 1px solid var(--gray-mid);
  border-right: 1px solid var(--gray-light);
  border-bottom: 1px solid var(--gray-light);
  box-shadow: none;
  padding: 8px 13px 6px 15px;
}
.btn:disabled { color: var(--gray-mid); text-shadow: 1px 1px 0 var(--gray-light); }
.btn.btn-primary { font-weight: bold; padding: 9px 22px; font-size: 15px; text-align: center; min-width: 160px; }
.btn.btn-ignore { color: #555; font-style: italic; }

/* ===== TICK BAR ===== */
.tick-bar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 8px;
}
.tick-bar .log-strip {
  flex: 1;
  background: var(--field-bg);
  border-top: 1px solid var(--gray-mid);
  border-left: 1px solid var(--gray-mid);
  border-right: 1px solid var(--gray-light);
  border-bottom: 1px solid var(--gray-light);
  padding: 6px 10px;
  font-family: "Courier New",monospace;
  font-size: 13px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  height: 30px;
  display: flex;
  align-items: center;
}
.tick-bar .log-strip .wk { font-weight: bold; }

.status-bar {
  background: var(--gray);
  border-top: 1px solid var(--gray-light);
  padding: 3px 5px;
  display: flex;
  justify-content: space-between;
  font-size: 12px;
  flex-shrink: 0;
}
.status-bar .left, .status-bar .right {
  background: var(--gray);
  border-top: 1px solid var(--gray-mid);
  border-left: 1px solid var(--gray-mid);
  border-right: 1px solid var(--gray-light);
  border-bottom: 1px solid var(--gray-light);
  padding: 3px 10px;
}
.status-bar .right { font-family: "Courier New",monospace; }

/* ===== END DIALOG ===== */
.dialog-overlay {
  position: fixed; inset: 0;
  background: rgba(0,0,0,0.4);
  display: none;
  justify-content: center;
  align-items: center;
  z-index: 100;
}
.dialog-overlay.show { display: flex; }
.dialog {
  background: var(--gray);
  border-top: 2px solid var(--gray-light);
  border-left: 2px solid var(--gray-light);
  border-right: 2px solid var(--gray-mid);
  border-bottom: 2px solid var(--gray-mid);
  box-shadow: 2px 2px 0 0 var(--gray-dark);
  width: 520px;
  max-width: 90vw;
  display: flex;
  flex-direction: column;
}
.dialog .dialog-body {
  padding: 16px 14px;
  display: flex;
  flex-direction: column;
  gap: 12px;
}
.dialog .verdict-row { display: flex; gap: 14px; align-items: flex-start; }
.dialog .verdict-icon {
  width: 32px; height: 32px;
  background: var(--field-bg);
  border-top: 1px solid var(--gray-mid);
  border-left: 1px solid var(--gray-mid);
  border-right: 1px solid var(--gray-light);
  border-bottom: 1px solid var(--gray-light);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 22px;
  flex-shrink: 0;
}
.dialog .verdict { font-weight: bold; font-size: 16px; line-height: 1.3; margin-bottom: 6px; }
.dialog .verdict.win  { color: var(--positive); }
.dialog .verdict.lose { color: var(--negative); }
.dialog .takeaway { font-size: 13px; line-height: 1.45; }
.dialog .summary { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.dialog .summary-cell {
  background: var(--field-bg);
  border-top: 1px solid var(--gray-mid);
  border-left: 1px solid var(--gray-mid);
  border-right: 1px solid var(--gray-light);
  border-bottom: 1px solid var(--gray-light);
  padding: 6px 8px;
  font-size: 12px;
}
.dialog .summary-cell .label { color: var(--gray-mid); font-size: 11px; }
.dialog .summary-cell .val { font-weight: bold; font-family: "Courier New",monospace; font-size: 16px; }
.dialog .dialog-buttons {
  display: flex;
  justify-content: center;
  gap: 8px;
  padding: 8px;
  border-top: 1px solid var(--gray-light);
}
</style>
</head>
<body>

<div class="window">
  <div class="title-bar">
    <div class="title-text">
      <span class="title-icon"></span>
      <span>Pastrimi Operations Console — Petrit Reçica, CEO</span>
    </div>
    <div class="controls">
      <div class="ctrl">_</div>
      <div class="ctrl">▢</div>
      <div class="ctrl">✕</div>
    </div>
  </div>

  <div class="menu-bar">
    <div class="menu"><span class="underline">F</span>ile</div>
    <div class="menu"><span class="underline">E</span>dit</div>
    <div class="menu"><span class="underline">O</span>perations</div>
    <div class="menu"><span class="underline">R</span>eports</div>
    <div class="menu"><span class="underline">H</span>elp</div>
  </div>

  <div class="content">

    <div class="group">
      <span class="group-label">Operations Status</span>
      <div class="status-strip">
        <div class="status-cell"><span class="label">Week</span><span class="value" id="stat-week">1 / 52</span></div>
        <div class="status-cell"><span class="label">Cash</span><span class="value" id="stat-cash">€8,000</span></div>
        <div class="status-cell"><span class="label">Backlog</span><span class="value" id="stat-backlog">0t</span></div>
        <div class="status-cell"><span class="label">Income/wk</span><span class="value" id="stat-income">€—</span></div>
        <div class="status-cell"><span class="label">Costs/wk</span><span class="value" id="stat-costs">€—</span></div>
        <div class="status-cell"><span class="label">KLMC Debt</span><span class="value" id="stat-debt">€1,900</span></div>
      </div>
    </div>

    <div class="group">
      <span class="group-label">Mandates from Constituents</span>
      <div class="mandates-grid" id="mandates"></div>
    </div>

    <div class="main-grid">
      <div class="group">
        <span class="group-label">Inbox — Week <span id="inbox-wk">1</span></span>
        <div class="inbox-frame" id="inbox-frame"></div>
      </div>
      <div class="group">
        <span class="group-label">Selected Message</span>
        <div class="detail-frame" id="detail-frame"></div>
      </div>
    </div>

    <div class="tick-bar">
      <div class="log-strip" id="log-strip">System ready.</div>
      <button class="btn btn-primary" id="tick-btn">Advance Week ▶</button>
    </div>

  </div>

  <div class="status-bar">
    <span class="left" id="status-left">Ready</span>
    <span class="right" id="status-right">PRISTINA · CAPS</span>
  </div>
</div>

<div class="dialog-overlay" id="end-overlay">
  <div class="dialog">
    <div class="title-bar">
      <div class="title-text">
        <span class="title-icon"></span>
        <span id="end-title">End of Term</span>
      </div>
      <div class="controls"><div class="ctrl">✕</div></div>
    </div>
    <div class="dialog-body">
      <div class="verdict-row">
        <div class="verdict-icon" id="end-icon">!</div>
        <div>
          <div class="verdict" id="end-verdict">—</div>
          <div class="takeaway" id="end-takeaway">—</div>
        </div>
      </div>
      <div class="summary" id="end-summary"></div>
    </div>
    <div class="dialog-buttons">
      <button class="btn" id="replay-btn">Try Again</button>
      <button class="btn" disabled>Close</button>
    </div>
  </div>
</div>

<script>
(function(){

  function mkEl(tag, opts) {
    const e = document.createElement(tag);
    if (opts) {
      if (opts.cls) e.className = opts.cls;
      if (opts.text) e.textContent = opts.text;
      if (opts.style) e.style.cssText = opts.style;
      if (opts.onclick) e.onclick = opts.onclick;
      if (opts.disabled) e.disabled = true;
    }
    return e;
  }
  function clear(el) { while (el.firstChild) el.removeChild(el.firstChild); }
  function fmtMoney(n) {
    const s = Math.abs(Math.round(n)).toLocaleString('en-US');
    return (n < 0 ? '−€' : '€') + s;
  }
  function bumpSat(key, delta) {
    state.satisfaction[key] = Math.max(0, Math.min(100, state.satisfaction[key] + delta));
  }
  function logEntry(text) {
    state.log.unshift({ week: state.week, text: text });
    if (state.log.length > 8) state.log.pop();
  }

  // ====== INITIAL STATE ======
  const TOTAL_WEEKS = 52;

  function makeInitialState() {
    return {
      week: 1,
      cash: 8000,
      backlog: 0,
      capacity: 380,
      trashGenerated: 410,
      feeMonthly: 6.20,
      subscribedHouseholds: 720,
      withheldHouseholds: 230,
      extraWorkers: 0,
      recyclingMandate: false,
      klmcDebt: 1900,
      satisfaction: { households: 45, union: 60, mayor: 30, assembly: 70, klmc: 35, eu: 50 },
      lastWeeklyRevenue: 0,
      lastWeeklyCost: 0,
      lastCoverage: null,
      onStrike: false,
      strikeWeeks: 0,
      consecutiveLowUnion: 0,
      euSanctionApplied: false,
      oneShotsUsed: { eu: false, sue: false, halt: false, legalShield: false },
      pendingForcedEmail: null,  // queued email for next week from cascading consequences
      inbox: [],
      selectedEmailId: null,
      log: [],
      gameOver: null,
      _wageBump: 0,
      emailIdCounter: 0,
      templateHistory: {},  // templateId → last week fired (for cooldowns)
    };
  }

  let state = makeInitialState();

  // ====== MANDATES ======
  // Each mandate has: holder (stakeholder), text (what they want), check(state) -> 'met'|'edge'|'breach'
  const MANDATES = [
    {
      id: 'm_households', holder: 'Households',
      text: 'Coverage ≥ 90%, backlog ≤ 30t',
      check: function(s) {
        const cov = s.lastCoverage === null ? 1 : s.lastCoverage;
        if (cov >= 0.90 && s.backlog <= 30) return 'met';
        if (cov >= 0.80 && s.backlog <= 80) return 'edge';
        return 'breach';
      },
      meterValue: function(s) { return s.satisfaction.households; }
    },
    {
      id: 'm_union', holder: 'Krasniqi (Union)',
      text: 'Wages stable, no layoffs',
      check: function(s) {
        if (s.satisfaction.union >= 55) return 'met';
        if (s.satisfaction.union >= 35) return 'edge';
        return 'breach';
      },
      meterValue: function(s) { return s.satisfaction.union; }
    },
    {
      id: 'm_mayor', holder: 'Mayor Rama',
      text: 'No public broadside; respect his office',
      check: function(s) {
        if (s.satisfaction.mayor >= 45) return 'met';
        if (s.satisfaction.mayor >= 25) return 'edge';
        return 'breach';
      },
      meterValue: function(s) { return s.satisfaction.mayor; }
    },
    {
      id: 'm_assembly', holder: 'Assembly (PDK+VV)',
      text: 'Defend the Dec 2024 regulation publicly',
      check: function(s) {
        if (s.satisfaction.assembly >= 60) return 'met';
        if (s.satisfaction.assembly >= 40) return 'edge';
        return 'breach';
      },
      meterValue: function(s) { return s.satisfaction.assembly; }
    },
    {
      id: 'm_klmc', holder: 'KLMC (Velija)',
      text: 'Outstanding debt below €3,000',
      check: function(s) {
        if (s.klmcDebt < 2200) return 'met';
        if (s.klmcDebt < 3500) return 'edge';
        return 'breach';
      },
      meterValue: function(s) {
        // Inverse — less debt = higher score (out of 100)
        return Math.max(0, Math.min(100, Math.round(100 - (s.klmcDebt / 50))));
      }
    },
    {
      id: 'm_eu', holder: 'EU Office',
      text: 'Visible recycling progress',
      check: function(s) {

  // ====== ECONOMICS HELPERS ======
  function calcWeeklyRevenue(s) {
    if (s.onStrike) return 0;  // no service = some lose payments, simplified to 0
    return Math.round((s.feeMonthly * s.subscribedHouseholds) / 4);
  }
  function calcWeeklyCost(s) {
    let cost = 1100
      + (s.extraWorkers * 300)
      + (s.recyclingMandate ? 600 : 0)
      + (s._wageBump || 0);
    if (s.onStrike) cost = Math.round(cost * 0.4);  // strike — partial pay (admin only), saves money
    return cost;
  }

  // ====== EMAIL TEMPLATES ======
  // Each template: id, sender, subject(s), body(s), options(s), eligibility(s)
  // The (s) variants are functions of state, so we get parametrized content.

  function generateChiefBriefing(s) {
    const lines = ['Petrit,'];
    lines.push('Weekly read-out for week ' + s.week + ':');
    lines.push('');
    if (s.satisfaction.union < 35) lines.push('• Krasniqi is one bad meeting from a strike. The Sunday committee is talking.');
    else if (s.satisfaction.union > 70) lines.push('• Krasniqi steady. Union calm.');
    else lines.push('• Union watching wages closely.');

    if (s.satisfaction.mayor < 25) lines.push('• Mayor Rama leaked another quote to KOHA. He is preparing something.');
    else if (s.satisfaction.mayor < 40) lines.push('• Mayor cold but not in motion.');
    else lines.push('• Mayor diplomatic this week.');

    if (s.satisfaction.klmc < 30) lines.push('• Velija called the KLMC Board. They are weighing whether to refuse trucks.');
    else if (s.klmcDebt > 2500) lines.push('• Velija anxious about the rising invoice but communicative.');
    else lines.push('• Velija quiet. Invoice manageable.');

    if (s.satisfaction.assembly > 70) lines.push('• Assembly bloc rock-solid behind us.');
    else if (s.satisfaction.assembly < 50) lines.push('• PDK assembly group grumbling. Watch for defections.');

    if (s.satisfaction.eu < 40) lines.push('• EU Office wrote to Pristina. Annual report concerns.');

    if (s.satisfaction.households < 40) lines.push('• Households complaining loudly. KOHA quotes incoming.');

    if (s.withheldHouseholds > 0) lines.push('• Reminder: ~' + (s.withheldHouseholds * 100) + ' households still unregistered. Lost revenue ongoing.');

    if (s.cash < 2000) lines.push('• Cash low. Watch payroll.');

    // Hint based on lowest faction
    const sortedLow = Object.keys(s.satisfaction).map(function(k) { return [k, s.satisfaction[k]]; }).sort(function(a, b) { return a[1] - b[1]; });
    const worst = sortedLow[0][0];
    const hints = {
      households: 'Suggest: cleanup blitz, visible service, or registry push.',
      union: 'Suggest: Krasniqi appreciates wage moves more than promises.',
      mayor: 'Suggest: a small concession or symbolic backing of his office.',
      assembly: 'Suggest: don\'t back the Mayor publicly. They want loyalty.',
      klmc: 'Suggest: even a partial payment buys you a month with Velija.',
      eu: 'Suggest: a formal recycling commitment helps the annual report.',
    };
    lines.push('');
    lines.push('Recommendation: ' + (hints[worst] || ''));
    lines.push('');
    lines.push('— Mira');
    return lines.join('\n');
  }

    truck_run_short: function() { state.capacity -= 30; logEntry('Truck #04 sidelined. Capacity −30t/wk until handled.'); },
    truck_ignore: function() { state.capacity -= 40; bumpSat('union', -5); logEntry('Ignored truck breakdown. Crew frustrated.'); },
    it_upgrade: function() {
      if (state.cash < 1200) { logEntry('No cash for IT upgrade.'); return; }
      state.cash -= 1200; logEntry('Email server upgraded.');
    },
    it_webmail: function() { logEntry('Org switched to webmail. Saved cash.'); },
    finance_chase: function() { bumpSat('klmc', +2); logEntry('Finance chasing the €400 KLMC discrepancy.'); },
    finance_writeoff: function() { logEntry('€400 KLMC discrepancy written off.'); },
    hr_agency_cover: function() {
      if (state.cash < 600) { logEntry('Cannot fund agency cover. Coverage drops.'); state.capacity -= 30; return; }
      state.cash -= 600; logEntry('Agency cover for sick staff authorized.');
    },
    hr_run_short: function() { state.capacity -= 30; bumpSat('households', -3); logEntry('Ran short-staffed.'); },
    hr_overtime: function() { bumpSat('union', -6); logEntry('Asked Krasniqi to cover via overtime. Cool reception.'); },
    fuel_lock: function() {
      if (state.cash < 1400) { logEntry('Cannot lock fuel rate.'); return; }
      state.cash -= 1400; logEntry('Locked fuel rate. Cost stable for the quarter.');
    },
    fuel_accept: function() { state._wageBump = (state._wageBump || 0) + 200; logEntry('Accepted higher diesel rate. Ops cost +€200/wk.'); },
    pilot_smart_bins: function() {
      if (state.cash < 2000) { logEntry('Cannot fund smart-bin pilot.'); return; }
      state.cash -= 2000; bumpSat('eu', +6); bumpSat('households', +3); logEntry('Smart-bin pilot funded. EU pleased.');
    },

    // Citizen variants
    citizen_reroute: function() {
      if (state.cash < 400) { logEntry('Cannot fund reroute.'); bumpSat('households', -3); return; }
      state.cash -= 400; bumpSat('households', +5); logEntry('Reroute to Sunny Hill authorized.');
    },
    citizen_replace_container: function() {
      if (state.cash < 600) { logEntry('Cannot replace container.'); bumpSat('households', -3); return; }
      state.cash -= 600; bumpSat('households', +6); logEntry('Damaged container replaced in Vellusha.');
    },
    citizen_refer_legal: function() { bumpSat('households', -2); logEntry('Vellusha injury referred to legal.'); },
    citizen_lajthishte_visit: function() { bumpSat('households', +6); bumpSat('mayor', +3); logEntry('Visited Lajthishtë in person. Press picked it up.'); },
    citizen_blame_klmc: function() { bumpSat('households', -8); bumpSat('klmc', -4); logEntry('Blamed KLMC publicly. Velija furious.'); },
    hotel_reroute: function() {
      if (state.cash < 700) { logEntry('Cannot fund hotel reroute.'); return; }
      state.cash -= 700; bumpSat('households', +2); logEntry('Airport-corridor reroute authorized.');
    },
    hotel_informal: function() { logEntry('Informal arrangement with hotel group.'); },

    // Press variants
    press_aggressive: function() { bumpSat('mayor', -12); bumpSat('assembly', +6); bumpSat('households', -2); logEntry('Aggressive Telegrafi statement. Mayor enraged.'); },
    press_balanced: function() { bumpSat('mayor', -4); bumpSat('assembly', +2); bumpSat('eu', +2); logEntry('Balanced Telegrafi statement.'); },
    press_access_full: function() { bumpSat('households', +6); bumpSat('union', +4); bumpSat('mayor', -3); logEntry('Full Prishtina Insight access. Risky but humanizing.'); },
    press_access_limited: function() { bumpSat('households', +2); logEntry('Limited Prishtina Insight access.'); },
    press_access_decline: function() { bumpSat('households', -2); logEntry('Declined Prishtina Insight feature.'); },
    press_op_ed: function() { bumpSat('eu', +6); bumpSat('households', +2); logEntry('Wrote Kosovo 2.0 op-ed personally.'); },
    press_op_ed_ghost: function() { bumpSat('eu', +3); logEntry('Mira ghost-wrote the Kosovo 2.0 op-ed.'); },
    press_profile: function() { bumpSat('households', +5); bumpSat('mayor', -4); logEntry('Sat for RFE/RL profile.'); },

    // Other gov / civic
    ammk_respond: function() { bumpSat('eu', +3); bumpSat('klmc', +3); logEntry('Submitted joint AMMK response with KLMC.'); },
    ammk_pushback: function() { bumpSat('eu', -4); bumpSat('klmc', -6); logEntry('Pushed back on AMMK finding.'); },
    atlas_critical: function() { bumpSat('mayor', -6); bumpSat('assembly', +2); logEntry('Sharp Atlas quote (Mayor critique).'); },
    atlas_balanced: function() { bumpSat('eu', +3); logEntry('Balanced Atlas quote.'); },
    hackerspace_help: function() { bumpSat('households', +3); logEntry('Sat for FLOSSK interview. Civic-tech project gets your time.'); },

    // Red herrings — most do nothing
    phishing_click: function() { state.cash -= 800; bumpSat('households', -2); logEntry('Clicked phishing link. Some funds compromised. Faton flagged it.'); },
    phishing_forward: function() { logEntry('Forwarded phishing to Arta. She handles it.'); },
    conference_accept: function() {
      if (state.cash < 1800) { logEntry('Cannot afford Vienna trip.'); return; }
      state.cash -= 1800; bumpSat('eu', +4); logEntry('Vienna conference attended. Modest EU goodwill.');
    },
    fake_grant_pay: function() { state.cash -= 1200; logEntry('Paid fake grant fee. €1,200 gone. Faton notes the loss.'); },
    fake_grant_verify: function() { logEntry('Forwarded fake grant to Faton. Confirmed scam, no loss.'); },

    // Internal anonymous complaint
    internal_investigate: function() {
      if (state.cash < 600) { logEntry('Cannot fund investigation.'); return; }
      state.cash -= 600; bumpSat('union', +3); logEntry('Confidential investigation opened at Depot 2.');
    },
    internal_krasniqi: function() { bumpSat('union', +6); logEntry('Brought the Depot 2 complaint to Krasniqi quietly.'); },
    internal_dismiss: function() { bumpSat('union', -8); logEntry('Filed and forgot Depot 2 complaint. Word will spread.'); },
  };

  // ====== INBOX GENERATION ======
  function nextEmailId() {
    state.emailIdCounter++;
    return 'e' + state.emailIdCounter;
  }

  function generateInbox() {
    const inbox = [];

    // Always: Chief of Staff
    const cosTpl = TEMPLATES.find(function(t) { return t.id === 't_cos'; });
    const cosBuilt = cosTpl.build(state);
    inbox.push({
      id: nextEmailId(), templateId: cosTpl.id, sender: cosBuilt.sender, subject: cosBuilt.subject,
      body: cosBuilt.body, options: cosBuilt.options, resolved: false, chosenLabel: null,
    });
    state.templateHistory[cosTpl.id] = state.week;

    // Pending forced (e.g. Jashari follow-up)
    const ombudsTpl = TEMPLATES.find(function(t) { return t.id === 't_jashari'; });
    if (state._ombudspersonPending && ombudsTpl) {
      const built = ombudsTpl.build(state);
      inbox.push({
        id: nextEmailId(), templateId: ombudsTpl.id, sender: built.sender, subject: built.subject,
        body: built.body, options: built.options, resolved: false, chosenLabel: null,
      });
      state.templateHistory[ombudsTpl.id] = state.week;
    }

    // Easter egg: hardcoded FLOSSK / Prishtina Hackerspace email in week 3
    if (state.week === 3) {
      const hsTpl = TEMPLATES.find(function(t) { return t.id === 't_hackerspace'; });
      if (hsTpl && state.templateHistory[hsTpl.id] === undefined) {
        const built = hsTpl.build(state);
        inbox.push({
          id: nextEmailId(), templateId: hsTpl.id, sender: built.sender, subject: built.subject,
          body: built.body, options: built.options, resolved: false, chosenLabel: null,
        });
        state.templateHistory[hsTpl.id] = state.week;
      }
    }

    // Roll others — respect cooldowns
    const candidates = [];
    for (let i = 0; i < TEMPLATES.length; i++) {
      const t = TEMPLATES[i];
      if (t.always || t.id === 't_jashari') continue;
      if (t.eligible && !t.eligible(state)) continue;
      // Cooldown check
      const last = state.templateHistory[t.id];
      const cd = t.cooldown || 1;
      if (last !== undefined && (state.week - last) < cd) continue;
      const w = t.weight ? t.weight(state) : 1;
      for (let r = 0; r < w; r++) candidates.push(t);
    }
    // Shuffle
    candidates.sort(function() { return Math.random() - 0.5; });

    // Bigger inbox: 4-7 additional emails (5-8 total with Chief)
    const target = 4 + Math.floor(Math.random() * 4);
    const usedIds = {};
    for (let i = 0; i < candidates.length && inbox.length < target + 1; i++) {
      const t = candidates[i];
      if (usedIds[t.id]) continue;
      usedIds[t.id] = true;
      const built = t.build(state);
      inbox.push({
        id: nextEmailId(), templateId: t.id, sender: built.sender, subject: built.subject,
        body: built.body, options: built.options, resolved: false, chosenLabel: null,
      });
      state.templateHistory[t.id] = state.week;
    }

    state.inbox = inbox;
    state.selectedEmailId = inbox.length > 0 ? inbox[0].id : null;
  }

  // ====== TICK ======
  function tick() {
    if (state.gameOver) return;

    const prev = Object.assign({}, state.satisfaction);

    // Process unresolved emails as Ignore
    for (let i = 0; i < state.inbox.length; i++) {
      const em = state.inbox[i];
      if (!em.resolved) {
        em.resolved = true;
        em.chosenLabel = '(no action)';
      }
    }

    // Auto-resolve weekly flow
    state.backlog += state.trashGenerated;
    let effCap = state.onStrike ? 0 : Math.max(0, state.capacity);
    const collected = Math.min(effCap, state.backlog);
    state.backlog -= collected;
    state.lastCoverage = state.trashGenerated > 0 ? collected / state.trashGenerated : 1;

    state.lastWeeklyRevenue = calcWeeklyRevenue(state);
    state.cash += state.lastWeeklyRevenue;

    state.lastWeeklyCost = calcWeeklyCost(state);
    state.cash -= state.lastWeeklyCost;

    const klmcBill = collected * 0.5;
    state.klmcDebt += klmcBill;

    // Strike auto-end after 1 week
    if (state.onStrike) {
      state.strikeWeeks++;
      if (state.strikeWeeks > 1) {
        state.onStrike = false;
        state.strikeWeeks = 0;
        state.capacity = 380 + (state.extraWorkers * 20);  // restore
        logEntry('Strike ended. Operations resumed.');
      }
    }

    // Mandate-driven satisfaction drift
    let hDelta = 0;
    if (state.lastCoverage >= 0.95) hDelta += 2;
    else if (state.lastCoverage >= 0.85) hDelta += 0;
    else if (state.lastCoverage >= 0.75) hDelta -= 3;
    else hDelta -= 6;
    if (state.feeMonthly > 6.20) hDelta -= 1;
    bumpSat('households', hDelta);

    if (state.satisfaction.union >= 55) bumpSat('union', +1);
    else if (state.satisfaction.union < 35) bumpSat('union', -1);

    if (state.satisfaction.households < 40) bumpSat('mayor', -1);  // mayor takes citizen heat
    if (state.recyclingMandate) bumpSat('mayor', +1);

    if (state.satisfaction.households < 40) bumpSat('assembly', -1);
    if (state.satisfaction.households > 60) bumpSat('assembly', +1);

    if (state.klmcDebt > 5000) bumpSat('klmc', -3);
    else if (state.klmcDebt > 3000) bumpSat('klmc', -1);
    else if (state.klmcDebt < 1500) bumpSat('klmc', +1);

    if (state.recyclingMandate) bumpSat('eu', +1);
    else bumpSat('eu', -1);

    // EU sanction
    if (state.satisfaction.eu < 20 && !state.euSanctionApplied) {
      state.cash -= 30000;
      state.euSanctionApplied = true;
      logEntry('EU triggered compliance penalty: €30,000.');
    }

    if (state.satisfaction.union < 25) state.consecutiveLowUnion++;
    else state.consecutiveLowUnion = 0;

    // Lose conditions
    if (state.cash < -3000) {
      state.gameOver = { result: 'lose', verdict: 'Pastrimi went bankrupt.', takeaway: takeawayString('cash') };
    } else if (state.consecutiveLowUnion >= 3) {
      state.gameOver = { result: 'lose', verdict: 'Sustained strike. Operations collapsed.', takeaway: takeawayString('union') };
    } else if (state.satisfaction.mayor < 20 && state.satisfaction.assembly < 30) {
      state.gameOver = { result: 'lose', verdict: 'No-confidence vote. You are out.', takeaway: takeawayString('political') };
    } else if (state.week >= TOTAL_WEEKS) {
      const avgCitizen = (state.satisfaction.households + state.satisfaction.union) / 2;
      if (state.cash >= 0 && avgCitizen >= 50 && state.satisfaction.assembly >= 40) {
        state.gameOver = { result: 'win', verdict: 'You served a full year. The regulation holds.',
          takeaway: 'Fifty-two weeks. Pastrimi solvent. Pristina mostly served. Mirash still leaks. The system is still wildly complicated.' };
      } else if (state.cash < 0) {
        state.gameOver = { result: 'lose', verdict: 'Year ended in the red.', takeaway: takeawayString('cash') };
      } else {
        state.gameOver = { result: 'lose', verdict: 'Year ended with citizens unhappy.', takeaway: takeawayString('citizens') };
      }
    }

    state.week++;

    // Generate next inbox
    if (!state.gameOver) generateInbox();

    render();
    if (state.gameOver) showEndScreen();
  }

  function takeawayString(reason) {
    const sortedLow = Object.keys(state.satisfaction).map(function(k) { return [k, state.satisfaction[k]]; }).sort(function(a, b) { return a[1] - b[1]; });
    const worst = sortedLow[0];
    const stake = MANDATES.find(function(m) { return m.id === 'm_' + worst[0]; });
    const stakeName = stake ? stake.holder : worst[0];
    if (reason === 'cash') return 'Cash ran out. €6.20/mo flat does not cover ops + KLMC + Krasniqi at once. You alienated ' + stakeName + ' the most.';
    if (reason === 'union') return 'Krasniqi held the line. The Municipality used the chaos to bring private operators back.';
    if (reason === 'political') return 'Both blocs lost faith. The next director inherits everything you fought.';
    if (reason === 'citizens') return 'Cash held but Pristina did not feel served. ' + stakeName + ' was the one you alienated most.';
    return '';
  }

  // ====== EMAIL ACTIONS ======
  function selectEmail(id) {
    state.selectedEmailId = id;
    render();
  }

  function chooseOption(emailId, optionIndex) {
    const em = state.inbox.find(function(e) { return e.id === emailId; });
    if (!em || em.resolved) return;
    const opt = em.options[optionIndex];
    if (!opt) return;
    em.resolved = true;
    em.chosenLabel = opt.label;
    const fn = APPLIES[opt.applyKey];
    if (fn) fn();
    render();
  }

  // ====== RENDER ======
  function statusFor(check) {
    return check; // 'met'|'edge'|'breach'
  }

  function render() {
    // Top stats
    document.getElementById('stat-week').textContent = state.week + ' / ' + TOTAL_WEEKS;
    const cashEl = document.getElementById('stat-cash');
    cashEl.textContent = fmtMoney(state.cash);
    cashEl.className = 'value ' + (state.cash < 0 ? 'negative' : (state.cash < 1500 ? 'warn' : 'positive'));
    document.getElementById('stat-backlog').textContent = Math.round(state.backlog) + 't';

    // Income / Costs (recompute current projections)
    const projIncome = calcWeeklyRevenue(state);
    const projCost = calcWeeklyCost(state);
    const incomeEl = document.getElementById('stat-income');
    const costsEl = document.getElementById('stat-costs');
    incomeEl.textContent = fmtMoney(projIncome);
    costsEl.textContent = fmtMoney(projCost);
    incomeEl.className = 'value ' + (state.onStrike ? 'negative' : 'positive');
    costsEl.className = 'value ' + (projCost > projIncome ? 'warn' : '');

    const debtEl = document.getElementById('stat-debt');
    debtEl.textContent = fmtMoney(state.klmcDebt);
    debtEl.className = 'value ' + (state.klmcDebt > 3500 ? 'negative' : (state.klmcDebt > 2200 ? 'warn' : ''));

    // Mandates
    const mGrid = document.getElementById('mandates');
    clear(mGrid);
    for (let i = 0; i < MANDATES.length; i++) {
      const m = MANDATES[i];
      const status = m.check(state);
      const meterVal = m.meterValue(state);
      const card = mkEl('div', { cls: 'mandate-card' });
      card.appendChild(mkEl('div', { cls: 'holder', text: m.holder }));
      card.appendChild(mkEl('div', { cls: 'text', text: m.text }));
      const sb = mkEl('div', { cls: 'status-bar' });
      const meter = mkEl('div', { cls: 'meter' });
      const fill = mkEl('div', { cls: 'fill ' + status, style: 'width:' + Math.max(2, meterVal) + '%' });
      meter.appendChild(fill);
      sb.appendChild(meter);
      sb.appendChild(mkEl('div', { cls: 'status ' + status, text: status === 'met' ? '✓ MET' : (status === 'edge' ? '⚠ EDGE' : '✗ BREACH') }));
      card.appendChild(sb);
      mGrid.appendChild(card);
    }

    // Inbox week label
    document.getElementById('inbox-wk').textContent = state.week;

    // Inbox list
    const inboxEl = document.getElementById('inbox-frame');
    clear(inboxEl);
    const inboxList = mkEl('div', { cls: 'inbox-list' });
    if (state.inbox.length === 0) {
      inboxList.appendChild(mkEl('div', { cls: 'email-item', text: '(empty)' }));
    }
    for (let i = 0; i < state.inbox.length; i++) {
      const em = state.inbox[i];
      const cls = 'email-item' + (em.resolved ? ' resolved' : '') + (em.id === state.selectedEmailId ? ' selected' : '');
      const item = mkEl('div', { cls: cls });
      const icon = mkEl('div', { cls: 'icon', text: em.resolved ? '✓' : '✉' });
      const right = mkEl('div');
      right.appendChild(mkEl('div', { cls: 'sender', text: em.sender }));
      right.appendChild(mkEl('div', { cls: 'subject', text: em.subject }));
      item.appendChild(icon);
      item.appendChild(right);
      item.onclick = function() { selectEmail(em.id); };
      inboxList.appendChild(item);
    }
    inboxEl.appendChild(inboxList);

    // Detail
    const detailEl = document.getElementById('detail-frame');
    clear(detailEl);
    const sel = state.inbox.find(function(e) { return e.id === state.selectedEmailId; });
    if (!sel) {
      detailEl.appendChild(mkEl('div', { cls: 'empty', text: 'Select a message to read.' }));
    } else {
      const dc = mkEl('div', { cls: 'detail-content' });
      const hr = mkEl('div', { cls: 'header-row' });
      hr.appendChild(mkEl('div', { cls: 'field-label', text: 'From:' }));
      hr.appendChild(mkEl('div', { cls: 'field-val', text: sel.sender }));
      hr.appendChild(mkEl('div', { cls: 'field-label', text: 'Subj:' }));
      hr.appendChild(mkEl('div', { cls: 'field-val', text: sel.subject }));
      dc.appendChild(hr);
      dc.appendChild(mkEl('div', { cls: 'body-text', text: sel.body }));

      if (sel.resolved) {
        dc.appendChild(mkEl('div', { cls: 'resolved-banner', text: 'Already resolved: ' + sel.chosenLabel }));
      } else {
        const optsRow = mkEl('div', { cls: 'options-row' });
        optsRow.appendChild(mkEl('div', { cls: 'options-label', text: 'Choose response:' }));
        for (let j = 0; j < sel.options.length; j++) {
          const opt = sel.options[j];
          const isIgnore = /ignore/i.test(opt.label);
          const b = mkEl('button', { cls: 'btn' + (isIgnore ? ' btn-ignore' : ''), text: opt.label });
          (function(idx) { b.onclick = function() { chooseOption(sel.id, idx); }; })(j);
          optsRow.appendChild(b);
        }
        dc.appendChild(optsRow);
      }
      detailEl.appendChild(dc);
    }

    // Tick
    document.getElementById('tick-btn').disabled = !!state.gameOver;

    // Log strip
    const logStrip = document.getElementById('log-strip');
    clear(logStrip);
    if (state.log.length === 0) {
      logStrip.appendChild(document.createTextNode('System ready.'));
    } else {
      const last = state.log[0];
      logStrip.appendChild(mkEl('span', { cls: 'wk', text: 'W' + last.week + ': ' }));
      logStrip.appendChild(document.createTextNode(last.text));
    }

    // Status bar
    const statusLeft = document.getElementById('status-left');
    if (state.gameOver) statusLeft.textContent = 'Term ended';
    else {
      const unresolved = state.inbox.filter(function(e) { return !e.resolved; }).length;
      statusLeft.textContent = unresolved + ' message' + (unresolved === 1 ? '' : 's') + ' unresolved';
    }
  }

  function showEndScreen() {
    const overlay = document.getElementById('end-overlay');
    overlay.classList.add('show');
    document.getElementById('end-title').textContent = 'End of Term — Week ' + (state.week - 1);
    document.getElementById('end-icon').textContent = state.gameOver.result === 'win' ? '✓' : '✕';
    const v = document.getElementById('end-verdict');
    v.textContent = state.gameOver.verdict;
    v.className = 'verdict ' + (state.gameOver.result === 'win' ? 'win' : 'lose');
    document.getElementById('end-takeaway').textContent = state.gameOver.takeaway;

    const summary = document.getElementById('end-summary');
    clear(summary);
    const items = [
      { label: 'Cash', val: fmtMoney(state.cash) },
      { label: 'KLMC debt', val: fmtMoney(state.klmcDebt) },
      { label: 'Coverage', val: state.lastCoverage === null ? '—' : Math.round(state.lastCoverage * 100) + '%' },
    ];
    for (let i = 0; i < items.length; i++) {
      const it = items[i];
      const cell = mkEl('div', { cls: 'summary-cell' });
      cell.appendChild(mkEl('div', { cls: 'label', text: it.label }));
      cell.appendChild(mkEl('div', { cls: 'val', text: it.val }));
      summary.appendChild(cell);
    }
  }

  // Clock
  function tickClock() {
    const d = new Date();
    const hh = String(d.getHours()).padStart(2, '0');
    const mm = String(d.getMinutes()).padStart(2, '0');
    document.getElementById('status-right').textContent = 'PRISTINA · ' + hh + ':' + mm;
  }
  setInterval(tickClock, 30000);
  tickClock();

  document.getElementById('tick-btn').addEventListener('click', tick);
  document.getElementById('replay-btn').addEventListener('click', function() {
    state = makeInitialState();
    document.getElementById('end-overlay').classList.remove('show');
    generateInbox();
    render();
  });
  document.addEventListener('keydown', function(e) {
    if (e.key === 'Enter' && !state.gameOver) {
      const tickBtn = document.getElementById('tick-btn');
      if (!tickBtn.disabled) tick();
    }
  });

  // Initial setup
  generateInbox();
  render();

})();
